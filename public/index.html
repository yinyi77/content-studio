<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F7F8FA" />
    <meta name="description" content="本地运行的 AI 图文创作工作台，从一段内容到一组作品。" />
    <title>图文工坊 · AI 图文创作</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20fill%3D%22%23193c59%22%20d%3D%22M2%202h12v12H2zM18%202h12v12H18zM2%2018h12v12H2z%22%2F%3E%3Cpath%20fill%3D%22%235689ba%22%20d%3D%22M18%2018h12v8a4%204%200%200%201-4%204h-8z%22%2F%3E%3C%2Fsvg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/professional.css" />
  </head>
  <body>
    <div id="app"><div class="boot-state"><span class="spinner"></span><p>正在打开图文工坊…</p></div></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="lightbox" class="lightbox" aria-label="图片预览">
      <div class="lightbox-toolbar"><span>作品预览</span><button type="button" class="button button-ghost" id="close-lightbox">关闭预览 ×</button></div>
      <img id="lightbox-image" alt="生成的图文作品完整预览" />
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
