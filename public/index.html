<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F6F4EE" />
    <meta name="description" content="本地运行的 AI 图文创作工作台，从一段内容到一组作品。" />
    <title>图文工坊 · AI 创作工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"><div class="boot-state"><span class="spinner"></span><p>正在打开图文工坊…</p></div></div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="lightbox" class="lightbox" aria-label="图片预览">
      <div class="lightbox-toolbar"><span>作品预览</span><button type="button" class="button button-ghost" id="close-lightbox">关闭预览 ×</button></div>
      <img id="lightbox-image" alt="生成的图文作品完整预览" />
    </dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
